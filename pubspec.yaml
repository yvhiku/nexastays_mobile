name: nexa_stays_f
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.6.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Icons ────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── State Management ─────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1
  flutter_bloc: ^9.1.1

  # ── Routing ──────────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ── Networking ───────────────────────────────────────────────────────
  dio: ^5.7.0
  flutter_idensic_mobile_sdk_plugin: ^1.42.0

  # ── Dependency Injection ─────────────────────────────────────────────
  get_it: ^9.2.1

  # ── Storage ──────────────────────────────────────────────────────────
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.5

  # ── Theming / Typography ─────────────────────────────────────────────
  google_fonts: ^8.0.2

  # ── Images & Media ──────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # ── Animations/Charts ────────────────────────────────────────────────
  lottie: ^3.3.1
  fl_chart: ^1.2.0

  # ── Location ─────────────────────────────────────────────────────────
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # ── Push Notifications ──────────────────────────────────────────────
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3

  # ── Connectivity ─────────────────────────────────────────────────────
  connectivity_plus: ^7.1.0
  device_info_plus: ^11.3.0

  # ── Functional Programming / Domain ─────────────────────────────────
  dartz: ^0.10.1
  equatable: ^2.0.7

  # ── Formatting ───────────────────────────────────────────────────────
  intl: ^0.20.2
  camera: ^0.12.0+1
  video_player: ^2.10.0
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  country_picker: ^2.0.27

dev_dependencies:
  flutter_test:
      sdk: flutter
  flutter_lints:
  mocktail:
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/ui/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/ui/icon_foreground.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: false
  windows:
    generate: false

flutter:
    uses-material-design: true

    fonts:
      - family: Poppins
        fonts:
          - asset: assets/fonts/Poppins-Regular.ttf
            weight: 400
          - asset: assets/fonts/Poppins-Medium.ttf
            weight: 500
          - asset: assets/fonts/Poppins-SemiBold.ttf
            weight: 600
          - asset: assets/fonts/Poppins-Bold.ttf
            weight: 700

      - family: Tajawal
        fonts:
          - asset: assets/fonts/Tajawal-ExtraLight.ttf
            weight: 200
          - asset: assets/fonts/Tajawal-Light.ttf
            weight: 300
          - asset: assets/fonts/Tajawal-Regular.ttf
            weight: 400
          - asset: assets/fonts/Tajawal-Medium.ttf
            weight: 500
          - asset: assets/fonts/Tajawal-Bold.ttf
            weight: 700
          - asset: assets/fonts/Tajawal-ExtraBold.ttf
            weight: 800
          - asset: assets/fonts/Tajawal-Black.ttf
            weight: 900
    assets:
      - assets/config/dev_api_host.txt
      - assets/images/stays/
      # UI
      - assets/images/ui/logo.png
      - assets/images/ui/splash.png
      - assets/images/ui/empty.png
      - assets/images/ui/background.jpg

      # Onboarding
      - assets/images/onboarding/discover.jpg
      - assets/images/onboarding/trusted.jpg
      - assets/images/onboarding/host.jpg

      # Animations (Lottie)
      - assets/animations/loading.json
      - assets/images/
      - assets/fonts/
      - assets/map/
      - assets/animations/
      - assets/icons/
      - assets/illustrations/

