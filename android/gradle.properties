org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compile fails with "different roots" when the app is on one drive (e.g. D:\)
# and pub.dev packages live under Pub\Cache on another (e.g. C:\). Disabling avoids that crash.
kotlin.incremental=false
